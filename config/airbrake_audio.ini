; airbrake_audio.ini - configuration for the airbrake_audio plugin.
; Sound files live in the "airbrake_audio" folder next to the DLL.
; Comments only on their own lines (starting with ;). Edit and restart the game.

[output]
; Extra gain baked into the sounds, behind a soft limiter (it never clips). 0 = original level.
; Independent of the game's own volume slider.
boost_db=6.0

[brake]
file=brake_loop.wav
; Second of the file where the loop restarts. The default sound has a 2 s attack, then loops.
; Use 0 to loop the whole file.
loop_start_s=2.0
fade_in_ms=60
fade_out_ms=200
; Volume with the pedal barely pressed and fully pressed (0 to 1).
volume_min=0.35
volume_max=1.00
; Below this speed the brake sound is muted (0 = always plays).
min_speed_kmh=3

[air_release]
file=air_release.wav
volume=0.90
; Braking this long (seconds) plays the whole sound at full volume.
full_brake_time_s=6.0
; Short brake application: volume multiplier and minimum duration (seconds).
short_volume=0.60
short_length_s=0.45
; How far (seconds) the early cut can reach before the whole sound is used.
audible_length_s=1.10
; Speed of the closing fade when the sound is cut early.
cut_fade_ms=120
; Brake applications shorter than this play no release sound.
min_brake_time_ms=400
; Minimum time between two release sounds.
cooldown_ms=1500

[trigger]
; Pedal above threshold_on = pressed; below threshold_off = released.
threshold_on=0.05
threshold_off=0.02
