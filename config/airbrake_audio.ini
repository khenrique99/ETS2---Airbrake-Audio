; airbrake_audio.ini
; PT: Configuração do plugin airbrake_audio.
; EN: Configuration for the airbrake_audio plugin.
;
; PT: Os arquivos de som ficam na pasta "airbrake_audio", ao lado da DLL.
; EN: Sound files live in the "airbrake_audio" folder next to the DLL.
;
; PT: Comentários só em linhas próprias (começando com ;). Edite e reinicie o jogo, ou use a tela (Ctrl + =).
; EN: Comments only on their own lines (starting with ;). Edit and restart the game, or use the window (Ctrl + =).

[output]
; PT: Ganho extra aplicado aos sons, com limitador suave (nunca estoura). 0 = nível original.
;     Independe do controle de volume do próprio jogo.
; EN: Extra gain baked into the sounds, behind a soft limiter (it never clips). 0 = original level.
;     Independent of the game's own volume slider.
boost_db=6.0

[brake]
; PT: Dois sons de freio: o de "temperatura baixa" (file_low) toca com o pedal abaixo de high_from;
;     dali para cima toca o de "temperatura alta" (file). A troca usa os fades abaixo, sem corte seco.
;     Para voltar ao som baixo o pedal precisa descer 3 pontos abaixo de high_from.
; EN: Two brake sounds: the "low temperature" one (file_low) plays with the pedal below high_from;
;     from there up the "high temperature" one (file) plays. The swap uses the fades below, no hard cut.
;     To go back to the low sound the pedal must drop 3 points below high_from.
file=brake_loop.wav
file_low=brake_loop_low.wav
; PT: Pedal (0 a 1) a partir do qual toca o som de temperatura alta. 0.65 = 65%. 1 = só no fundo.
; EN: Pedal (0 to 1) from which the high-temperature sound plays. 0.65 = 65%. 1 = full pedal only.
high_from=0.65
; PT: Segundo do arquivo em que o loop recomeça (loop_start_low_s é o do som baixo). Os sons padrão
;     têm 2 s de ataque e depois repetem. Use 0 para repetir o arquivo inteiro.
; EN: Second of the file where the loop restarts (loop_start_low_s is for the low sound). The default
;     sounds have a 2 s attack, then loop. Use 0 to loop the whole file.
loop_start_s=2.0
loop_start_low_s=2.0
fade_in_ms=60
fade_out_ms=200
; PT: Volume com o pedal leve e com o pedal no fundo (0 a 1).
; EN: Volume with the pedal barely pressed and fully pressed (0 to 1).
volume_min=0.35
volume_max=1.00
; PT: Abaixo dessa velocidade (km/h) o som de freio fica mudo (0 = sempre toca).
; EN: Below this speed (km/h) the brake sound is muted (0 = always plays).
min_speed_kmh=3

[air_release]
file=air_release.wav
volume=0.90
; PT: Uma freada com essa duração (segundos) toca o som inteiro, em volume cheio.
; EN: Braking this long (seconds) plays the whole sound at full volume.
full_brake_time_s=6.0
; PT: Freada curta: multiplicador de volume e duração mínima do ar (segundos).
; EN: Short brake application: volume multiplier and minimum duration (seconds).
short_volume=0.60
short_length_s=0.45
; PT: Até onde (segundos) o corte pode chegar antes de liberar o som inteiro.
; EN: How far (seconds) the early cut can reach before the whole sound is used.
audible_length_s=1.10
; PT: Velocidade do fechamento quando o ar é cortado cedo.
; EN: Speed of the closing fade when the sound is cut early.
cut_fade_ms=120
; PT: Freadas mais curtas que isso não tocam a saída de ar.
; EN: Brake applications shorter than this play no release sound.
min_brake_time_ms=400
; PT: Tempo mínimo entre duas saídas de ar.
; EN: Minimum time between two release sounds.
cooldown_ms=1500
; PT: A saída de ar só toca se a freada ficou pelo menos esse tempo (segundos, somado) no som de
;     temperatura alta (pedal acima de high_from). Freada só no som baixo não solta ar. 0 = sempre toca.
; EN: The air release only plays if the brake application spent at least this long (seconds, summed) on the
;     high-temperature sound (pedal above high_from). Braking only on the low sound releases no air. 0 = always plays.
min_high_time_s=2.0

[trigger]
; PT: Pedal acima de threshold_on = pressionado; abaixo de threshold_off = solto.
; EN: Pedal above threshold_on = pressed; below threshold_off = released.
threshold_on=0.05
threshold_off=0.02

[ui]
; PT: Atalho no jogo que abre o painel. "on" liga o atalho, "off" desliga.
; EN: In-game shortcut that opens the panel. "on" enables the shortcut, "off" disables it.
app=on
; PT: game     -> o painel abre DENTRO do jogo, por cima da imagem, sem tirar o jogo de primeiro plano.
;                 Precisa do ETS2 em DirectX 11 (o padrão). Se não der, o plugin usa o AirbrakeAudio.exe.
;     external -> abre o AirbrakeAudio.exe (janela separada; precisa estar na pasta plugins, junto da DLL).
;     No painel: Esc fecha; setas escolhem e ajustam; Tab troca de aba; Ctrl + S salva. Vale ao reiniciar o jogo.
; EN: game     -> the panel opens INSIDE the game, over the image, without taking the game out of the foreground.
;                 It needs ETS2 on DirectX 11 (the default). If that fails, the plugin uses AirbrakeAudio.exe.
;     external -> opens AirbrakeAudio.exe (a separate window; it must sit in the plugins folder, next to the DLL).
;     In the panel: Esc closes; arrows pick and adjust; Tab switches tab; Ctrl + S saves. Applies after restarting the game.
mode=game
; PT: Combinação de teclas, ex.: CTRL+PLUS (Ctrl + =), CTRL+F9, ALT+B. Use Ctrl, Alt ou uma tecla F1-F24.
;     Não use CTRL+MINUS: é o atalho do Trailer Control.
; EN: Key combination, e.g. CTRL+PLUS (Ctrl + =), CTRL+F9, ALT+B. Use Ctrl, Alt or an F1-F24 key.
;     Do not use CTRL+MINUS: it is the Trailer Control shortcut.
hotkey=CTRL+PLUS
